services:
  - type: web
    name: portfolio
    runtime: static
    branch: main
    autoDeploy: true
    # Publish only the site files, not repo internals (README, AGENTS.md, reference/)
    buildCommand: npm install && npm run build:tailwind && mkdir -p public/dist && cp index.html script.js content.json og-image.png public/ && cp dist/output.css public/dist/
    staticPublishPath: public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
