services:
  - type: web
    name: portfolio
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build:tailwind
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
